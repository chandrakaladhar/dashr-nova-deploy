# Promote by copying image.tag (and the chart tag in kustomization.yaml)
# from staging once it has been verified there.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashr-nova
spec:
  values:
    replicaCount: 3
    image:
      tag: "0.1.0"
      # digest: "sha256:..."   # optional: pin the exact build
    env:
      APP_ENV: production
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        memory: 768Mi
