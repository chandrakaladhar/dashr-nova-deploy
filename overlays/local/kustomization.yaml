apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: helmrelease-patch.yaml
  # Locally, follow the chart on main so chart edits apply without tagging.
  - target:
      kind: GitRepository
      name: dashr-nova-source
    patch: |-
      - op: replace
        path: /spec/ref
        value:
          branch: main
  # Local only: corporate proxy (Zscaler) re-signs TLS for github.com.
  # Secret corp-ca (key ca.crt) is created by hand in the dashr-nova namespace.
  - target:
      kind: GitRepository
      name: dashr-nova-source
    patch: |-
      - op: add
        path: /spec/secretRef
        value:
          name: corp-ca
