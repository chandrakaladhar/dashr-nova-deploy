apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: helmrelease-patch.yaml
  - target:
      kind: GitRepository
      name: dashr-nova-source
    patch: |-
      - op: replace
        path: /spec/ref
        value:
          tag: v0.1.0      # chart version deployed to staging
